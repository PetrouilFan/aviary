[project]
name = "aviary"
version = "0.1.0"
description = "Web console for Canary agent harnesses: chat, agent tree, stats, jobs, memory, evals and releases"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PetrouilFan" }]
requires-python = ">=3.12"
keywords = ["agent", "agent-harness", "dashboard", "web-ui", "canary"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "canary",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "pytest-timeout>=2", "ruff>=0.6"]

[project.scripts]
aviary = "aviary.cli:main"

[project.urls]
Homepage = "https://github.com/PetrouilFan/aviary"
Repository = "https://github.com/PetrouilFan/aviary"
Issues = "https://github.com/PetrouilFan/aviary/issues"
Changelog = "https://github.com/PetrouilFan/aviary/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aviary"]

[tool.uv.sources]
canary = { path = "canary", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["aviary", "canary"]

[tool.ruff.lint.per-file-ignores]
"src/aviary/app.py" = ["B008"]

[tool.pytest.ini_options]
timeout = 120
testpaths = ["tests"]
